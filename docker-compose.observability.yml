# ---------------------------------------------------------------------------
# 可观测性层：Langfuse（LLM 调用追踪）+ OpenTelemetry Collector
#
# 定位：独立 compose 文件，不影响核心组件层（docker-compose.yml）。
#       复用核心层的 PG（单独 langfuse 库）和 Redis，自己只带 ClickHouse/MinIO。
#
# 用法（先确保核心层 docker compose up -d 已起）：
#   docker compose -f docker-compose.observability.yml up -d     起观测栈
#   docker compose -f docker-compose.observability.yml ps        看状态
#   docker compose -f docker-compose.observability.yml down      停（保留数据卷）
#
# 入口：
#   Langfuse 控制台  http://localhost:3000   （lijie@tcs.local / 见 LANGFUSE_INIT_USER_PASSWORD）
#   MinIO 控制台     http://localhost:9002   （minio / miniosecret）
#   OTel Collector   grpc :4317 / http :4318 （应用发 trace 到这，再转发 Langfuse）
#
# 应用侧接入（写进 customer_service/.env 即可，P6 接线用）：
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   LANGFUSE_PUBLIC_KEY=pk-lf-tcs-dev-0001
#   LANGFUSE_SECRET_KEY=sk-lf-tcs-dev-0001
#   LANGFUSE_HOST=http://localhost:3000
# ---------------------------------------------------------------------------

name: tcs-obs

networks:
  core:
    # 挂到核心组件层的网络，直接按服务名访问 postgres / redis
    external: true
    name: tcs_default

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:pgpass@postgres:5432/langfuse
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: e7136c798d9b054ffb6e3a720a439e366209f69eecc33a210b7a2e2b98fd8da3
  SALT: 5bd1b8754a4a3728b8dc4158fcf19aa15b48281721bfa5e6
  ENCRYPTION_KEY: c50b635de6e21dd45a9e5444fc40180b63329095e58d88efecba56e85ccc8549
  # 首次启动自动初始化 组织/项目/账号/API Key，省得手动建
  LANGFUSE_INIT_ORG_ID: tcs
  LANGFUSE_INIT_ORG_NAME: TCS
  LANGFUSE_INIT_PROJECT_ID: tcs
  LANGFUSE_INIT_PROJECT_NAME: text-customer-service
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-tcs-dev-0001
  LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-tcs-dev-0001
  LANGFUSE_INIT_USER_EMAIL: lijie@tcs.local
  LANGFUSE_INIT_USER_NAME: lijie
  LANGFUSE_INIT_USER_PASSWORD: Lijie#2026Dev
  # webhook SSRF 白名单：放行宿主机回环（评测 webhook 挂在宿主机的 langgraph dev 上）。
  # host.docker.internal 被硬编码黑名单拦（源码 isHostnameBlocked），
  # _HOST 白名单优先级更高、直接短路 IP 检查——自建本地栈才这么配，上云别带
  LANGFUSE_WEBHOOK_WHITELISTED_HOST: host.docker.internal

services:
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: tcs-langfuse-web
    restart: unless-stopped
    environment: *langfuse-env
    ports:
      - "3000:3000"
    networks: [core]
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # langfuse v3 的 Next.js 绑的是容器主机名 IP，不是 0.0.0.0，localhost/127.0.0.1 探不通
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # 首次要跑 PG/ClickHouse 迁移，慢

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: tcs-langfuse-worker
    restart: unless-stopped
    environment: *langfuse-env
    networks: [core]
    depends_on:
      langfuse-web:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tcs-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes:
      - ch_data:/var/lib/clickhouse
    networks: [core]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "clickhouse", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio:
    # docker.io 的 minio/minio 被镜像站拒了，走 DaoCloud 的 quay 镜像源
    image: quay.m.daocloud.io/minio/minio:latest
    container_name: tcs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9002:9001"     # 控制台（9001 被 Windows 系统保留段占用，宿主改用 9002）；9000 API 只给容器网络内用
    volumes:
      - minio_data:/data
    networks: [core]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: tcs-minio-init
    networks: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniosecret &&
      mc mb --ignore-existing local/langfuse-events &&
      mc mb --ignore-existing local/langfuse-media &&
      echo buckets ready"

  otel-collector:
    # 用 core 版（~100MB）：otlp 接收 + batch + otlphttp 导出全在内置，不需要 contrib 版
    image: otel/opentelemetry-collector:latest
    container_name: tcs-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks: [core]
    depends_on:
      langfuse-web:
        condition: service_started

volumes:
  ch_data:
    name: tcs_ch_data
  minio_data:
    name: tcs_minio_data
